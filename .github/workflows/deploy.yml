name: Deploy Web Application

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Securely substitute environment variables/secrets into JS files
      - name: Substitute Secrets and Variables
        env:
          # Secret fetched from GitHub Secrets
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Variable fetched from GitHub Actions Variables
          DEFAULT_BOT_NAME: ${{ vars.DEFAULT_BOT_NAME }}
        run: |
          # Inject secrets into JavaScript source directly at runner level
          sed -i "s|DISCORD_WEBHOOK_PLACEHOLDER|${DISCORD_WEBHOOK_URL}|g" js/firebase-config.js
          sed -i "s|DEFAULT_BOT_NAME_PLACEHOLDER|${DEFAULT_BOT_NAME}|g" js/firebase-config.js

      - name: Deploy to GitHub Pages (or static target)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./